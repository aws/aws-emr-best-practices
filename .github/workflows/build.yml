name: Build website

# Builds the Docusaurus site on every pull request so a broken dependency
# bump or a broken link fails the check before it can be merged. This is the
# CI gate the Dependabot Auto-Merge app waits on.

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - run: npm run build
